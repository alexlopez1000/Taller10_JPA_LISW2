# H2 in-memory database used for the laboratory execution and tests.
spring.datasource.url=jdbc:h2:mem:questionbankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Schema is recreated on every start so each demo run begins from a clean state.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
